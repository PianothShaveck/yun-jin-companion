name: Check desktop app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux graphics and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libpulse0
      - run: |
          python -m pip install --only-binary=:all: -r installer/requirements.txt
      - run: python tests/test_release.py
      - run: python tests/test_macos_overlay.py
      - run: python tests/test_macos_access.py
      - run: python tests/test_behavior_updates.py
      - run: python tests/test_dialogs_settings.py
      - run: python tests/test_context.py
      - run: python tests/test_weather_location.py
      - run: python tests/test_forecast.py
      - run: python tests/test_speech_bubbles.py
      - run: python tests/test_animation_menu.py
      - run: python tests/test_resource_usage.py
      - run: python tests/test_srs.py
      - run: python tests/test_study_ui.py
      - run: python tests/test_study_rotation.py
      - run: python tests/test_anki_reader.py
      - run: python tests/test_hotkeys.py
      - run: python tests/test_updater.py
      - run: python tests/test_windows_encoding.py
      - run: python tests/test_windows_identity.py
      - run: python tests/test_windows_overlay.py
      - run: python tests/test_visibility.py
      - run: python tests/test_installer_runtime.py
      - name: Parse Windows installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem installer/*.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors) { throw ($Errors | Out-String) }
          }
      - name: Parse shell launchers
        if: runner.os != 'Windows'
        run: |
          bash -n Mac.command
          sh -n Linux.sh
          sh -n installer/install-mac-bundle.sh
      - name: Check installer data preservation and Mac bundle layout
        if: runner.os != 'Windows'
        run: python tests/test_installer.py
      - run: python tools/package_release.py
